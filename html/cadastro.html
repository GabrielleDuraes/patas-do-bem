<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - ONG Patas do Bem</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <h1>Cadastro de Voluntário</h1>

    <div class="alerta" role="alert">
        Preencha todos os campos obrigatórios antes de enviar o cadastro.
    </div>

    <form id="form-cadastro">

        <fieldset>
            <legend>Dados pessoais</legend>

            <label for="nome">Nome completo:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                required
            >

            <br><br>

            <label for="email">E-mail:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <br><br>

            <label for="nascimento">Data de nascimento:</label>
            <input
                type="date"
                id="nascimento"
                name="nascimento"
            >
        </fieldset>


        <fieldset>
            <legend>Endereço</legend>

            <label for="cep">CEP:</label>
            <input
                type="text"
                id="cep"
                name="cep"
                placeholder="00000-000"
                pattern="\d{5}-\d{3}"
                required
            >

            <br><br>

            <label for="endereco">Endereço:</label>
            <input
                type="text"
                id="endereco"
                name="endereco"
            >

            <br><br>

            <label for="cidade">Cidade:</label>
            <input
                type="text"
                id="cidade"
                name="cidade"
            >

            <br><br>

            <label for="estado">Estado:</label>
            <input
                type="text"
                id="estado"
                name="estado"
            >
        </fieldset>


        <fieldset>
            <legend>Contato e identificação</legend>

            <label for="cpf">CPF:</label>
            <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                required
            >

            <br><br>

            <label for="telefone">Telefone:</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(62) 99999-9999"
                pattern="\(\d{2}\) \d{5}-\d{4}"
                required
            >
        </fieldset>

        <br>

        <div class="form-acoes">
            <button type="submit">Enviar cadastro</button>
        </div>

    </form>


    <div id="modal-sucesso" class="modal">

        <div class="modal-conteudo">

            <h2>Cadastro enviado!</h2>

            <p>
                Obrigado pelo interesse em ser voluntário da ONG Patas do Bem.
            </p>

            <button type="button" id="fechar-modal">
                Fechar
            </button>

        </div>

    </div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="../js/storage.js"></script>
<script src="../js/animais.js"></script>
<script src="../js/formulario.js"></script>
<script src="../js/script.js"></script>
   

</body>

</html>
